name: Uitrollen naar staging

# Elke push naar main zet het thema op tal-leadership.bijnadaar.nl.
# Handmatig starten kan ook via het tabblad Actions.
# Staging staat standaard op het bijnadaar-account (SiteGround). Ander account: SSH_HOST, SSH_PORT en SSH_USER aanpassen.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  uitrollen:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: gnldm1102.siteground.biz
      SSH_PORT: 18765
      SSH_USER: u2594-ag8zh8mdhogx
      SITE: www/tal-leadership.bijnadaar.nl/public_html
      THEMA: tal-leadership
    steps:
      - name: Code ophalen
        uses: actions/checkout@v5

      - name: SSH-sleutel klaarzetten
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/sleutel
          chmod 600 ~/.ssh/sleutel
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Versienummer per uitrol ophogen (voor de browsercache)
        run: |
          BASIS=$(grep -m1 "define( 'THEMA_VERSIE'" functions.php | sed -E "s/.*'([0-9.]+)'.*/\1/")
          sed -i -E "s/define\( 'THEMA_VERSIE', '[^']+' \)/define( 'THEMA_VERSIE', '${BASIS}.${GITHUB_RUN_NUMBER}' )/" functions.php
          grep -m1 "THEMA_VERSIE" functions.php

      - name: Tokens bouwen uit designsysteem/tokens.json (de bron van waarheid)
        run: |
          if [ -f designsysteem/tokens.json ]; then php powerhub/bin/tokens.php; else echo "Geen designsysteem."; fi

      - name: CSS en JS verkleinen (alleen in de uitrol, de repo blijft leesbaar)
        run: |
          npx --yes esbuild@0.25 assets/css/*.css --minify --outdir=assets/css --allow-overwrite --log-level=warning
          npx --yes esbuild@0.25 assets/js/*.js --minify --outdir=assets/js --allow-overwrite --log-level=warning
          npx --yes esbuild@0.25 powerhub/assets/*.css powerhub/assets/*.js --minify --outdir=powerhub/assets --allow-overwrite --log-level=warning

      - name: Back-up van het huidige thema op de server
        run: |
          ssh -i ~/.ssh/sleutel -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "mkdir -p ~/thema-backups && if [ -d $SITE/wp-content/themes/$THEMA ]; then tar czf ~/thema-backups/$THEMA-\$(date +%Y%m%d-%H%M%S).tgz -C $SITE/wp-content/themes $THEMA; fi; ls -1t ~/thema-backups/$THEMA-*.tgz 2>/dev/null | tail -n +11 | xargs -r rm"

      - name: Thema uitrollen
        run: |
          rsync -az --delete --itemize-changes \
            --exclude '.git/' --exclude '.github/' --exclude '.gitignore' --exclude 'README.md' --exclude '*.bak*' \
            -e "ssh -i ~/.ssh/sleutel -p $SSH_PORT" \
            ./ "$SSH_USER@$SSH_HOST:$SITE/wp-content/themes/$THEMA/"

      - name: Staging uit de zoekmachines houden (voor de uitroltaken)
        run: |
          ssh -i ~/.ssh/sleutel -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd $SITE && wp option update blog_public 0"

      - name: Eenmalige taken na de uitrol (zie powerhub/kern/uitrol.php)
        run: |
          ssh -i ~/.ssh/sleutel -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd $SITE && wp eval 'do_action( \"powerhub_na_uitrol\" );'"

      - name: Rookstest (thema actief, Powerhub geladen, homepage bereikbaar)
        run: |
          ssh -i ~/.ssh/sleutel -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd $SITE && echo \"Actief thema: \$(wp option get stylesheet)\" && wp eval 'echo function_exists( \"powerhub\" ) ? \"Powerhub \" . POWERHUB_VERSIE . \" geladen\\n\" : \"Powerhub niet geladen (thema niet actief?)\\n\";' && echo \"Homepage: \$(curl -s -o /dev/null -w '%{http_code}' \$(wp option get home)/)\""

      - name: Cache legen
        run: |
          ssh -i ~/.ssh/sleutel -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "cd $SITE && (wp sg purge 2>/dev/null || wp cache flush)"
